# Cloudflare Tunnel config for Shrimp Cam.
#
# Install this as /etc/cloudflared/config.yml — NOT ~/.cloudflared/config.yml.
# `sudo cloudflared service install` runs as root, so a config in your own home
# directory is invisible to it and you'll get:
#   "Cannot determine default configuration path. No file [config.yml config.yaml]"
#
# The credentials JSON must be copied to /etc/cloudflared/ as well, since root
# can't read it from your home directory either:
#   sudo cp ~/.cloudflared/<TUNNEL_ID>.json /etc/cloudflared/
#   sudo chmod 600 /etc/cloudflared/<TUNNEL_ID>.json
#
# Or just run: TUNNEL_HOSTNAME=shrimp.example.com bash install-tunnel.sh
#
# Replace the placeholders:
#   <TUNNEL_ID>            the UUID from `cloudflared tunnel list`
#   shrimp.example.com     the hostname you routed to this tunnel

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # Your public hostname -> the local Flask app.
  - hostname: shrimp.example.com
    service: http://localhost:8080
  # Required catch-all: anything else returns 404.
  - service: http_status:404
